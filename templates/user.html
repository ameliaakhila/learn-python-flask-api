<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membaca data json</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="user-container">
        <h1>Data User</h1>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Umur</th>
                </tr>
            </thead>
            <tbody>
                {% for users in data_user %}
                <tr>
                    <td>{{ users['nama'] }}</td>
                    <td>{{ users['email'] }}</td>
                    <td>{{ users['pekerjaan'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
